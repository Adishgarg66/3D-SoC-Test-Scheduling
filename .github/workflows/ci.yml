name: VLSI SoC Test Suite CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Pytest Test Suite
      run: |
        python -m pytest tests/ -v

    - name: Execute Unified CLI Smoke Test (2D & Fixed 3D)
      run: |
        python run_test_suite.py --mode 2d --benchmark d695 --algorithm greedy --no-plots
        python run_test_suite.py --mode fixed3d --benchmark d695 --algorithm maco --no-plots --no-hil
